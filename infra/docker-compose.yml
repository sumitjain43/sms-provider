services:
  postgres:
    image: postgres:16-alpine
    container_name: smsgateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smsgateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: smsgateway-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      API_PORT: 8080
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/smsgateway?schema=public"
      SIMULATOR_MODE: "true"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      OTP_PEPPER: "dev-otp-pepper-secret-change-in-prod-123456789"
      WEBHOOK_SIGNING_KEY: "dev-webhook-secret-change-in-prod-987654321"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: smsgateway-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/smsgateway?schema=public"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

volumes:
  pgdata:

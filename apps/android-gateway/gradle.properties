# Project-wide Gradle settings for Android Gateway

# Enables the AndroidX toolchain
android.useAndroidX=true

# Enables transitive R classes optimization
android.nonTransitiveRClass=true

# JVM memory allocation for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official
